<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smileat Competitive Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;1,400&family=Nunito:ital,wght@0,400;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{--blue:#00a2e1;--ink:#545454;--mute:#888888;--green:#92b436;--pink:#fe2675;--purple:#6a1e93;--orange:#fe8100;--navy:#003f6d;--rule:#d6ecf7;--soft:#f3fafd}
*{box-sizing:border-box}
body{margin:0;font:400 14px/1.7 Montserrat,sans-serif;color:var(--ink);background:#fff}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:Nunito,sans-serif;font-weight:900;color:var(--blue);margin:0;line-height:1.15}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.w{max-width:1040px;margin:0 auto;padding:0 28px}
.top{border-bottom:1px solid var(--rule)}
.top .w{display:flex;justify-content:space-between;align-items:center;height:68px;gap:20px}
.brand{display:flex;align-items:center;gap:14px;font:800 16px Nunito;color:var(--blue)}
.brand img{height:32px;display:block}
.top nav{display:flex;gap:24px;font-size:12px;font-weight:600}
.top nav a{padding:24px 0;border-bottom:3px solid transparent;color:var(--mute)}
.top nav a:hover,.top nav a.on{color:var(--blue);border-color:var(--blue)}
.mast{padding:52px 0 40px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
.mast h1{font-size:48px;margin:8px 0 0}
.ed{font-size:16px;color:var(--mute);font-weight:500}
.chars{display:flex;gap:8px;margin-top:22px}.chars img{height:62px;width:auto}
.stats{display:flex;gap:6px;justify-content:flex-end}
.bub{width:128px;height:128px;background:var(--b) center/100% 100% no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:16px}
.bub b{font:900 41px/1 Nunito;color:var(--c)}.bub span{font-size:12px;color:var(--ink)}
.summary{grid-column:1/-1;background:var(--soft);border-radius:28px;padding:20px 28px}
.summary h3{font-size:18px;margin-bottom:2px}
.sec{padding:36px 0 8px}
.sec h2{font-size:24px;display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;border-bottom:3px solid var(--blue)}
.sec h2 a{font:600 12px Montserrat;color:var(--mute)}.sec h2 a:hover{color:var(--blue)}
.row{display:grid;grid-template-columns:1fr 190px 100px;gap:20px;align-items:center;padding:18px 0 18px 20px;border-bottom:1px solid var(--rule);border-left:6px solid var(--c)}
.row h3{font-size:18px}.row small{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.row .m,.row .d{font-size:12px;color:var(--mute)}.row:hover h3{color:var(--navy)}
.tag{display:inline-flex;align-items:center;gap:8px;font:600 12px Montserrat;color:var(--c);margin-bottom:4px}
.tag img{height:24px;width:auto}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 32px;margin-top:12px}
.cat{display:flex;align-items:center;gap:6px;padding:4px 0}
.cat .bb{width:100px;height:100px;flex:none;background:var(--b) center/100% 100% no-repeat;display:grid;place-items:center;padding-bottom:14px}
.cat .bb img{width:50px;height:50px;object-fit:contain}
.cat h3{font-size:18px;color:var(--navy)}.cat small{font-size:14px;color:var(--mute)}.cat:hover h3{color:var(--blue)}
.back{display:inline-block;margin:26px 0 0;font:600 12px Montserrat;color:var(--mute)}.back:hover{color:var(--blue)}
.art{display:grid;grid-template-columns:1fr 260px;gap:56px;padding:20px 0 48px}
.art h1{font-size:41px;margin:6px 0 16px}
.lede{font-size:18px;line-height:1.6;font-weight:500;margin:0}
.ph{background:var(--soft);border-radius:28px;height:260px;display:grid;place-items:center;color:var(--mute);font-size:12px;margin:26px 0;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.art h3{font-size:18px;margin:30px 0 8px}
.note{display:flex;gap:10px;align-items:center;margin:26px 0 34px;background:var(--soft);border-radius:28px;padding:14px 24px 14px 8px}
.note .bb{width:104px;height:104px;flex:none;background:var(--b) center/100% 100% no-repeat;display:grid;place-items:center;padding-bottom:14px}
.note .bb img{height:54px;width:auto}
.note h3{margin:0 0 4px}.note p{margin:0}
.fi{background:var(--soft);border-radius:28px;padding:22px 24px;font-size:14px;position:sticky;top:20px;align-self:start;margin:0}
.fi dt{font:600 12px Montserrat;color:var(--mute);margin-top:14px}.fi dt:first-child{margin-top:0}.fi dd{margin:2px 0 0;font-weight:500}
.pill{display:inline-block;font:700 12px Montserrat;color:#fff;background:var(--c);border-radius:12px;padding:2px 12px}
.empty{padding:40px 0;color:var(--mute)}
footer{border-top:1px solid var(--rule);margin-top:40px;padding:26px 0;font-size:12px;color:var(--mute)}
@media(max-width:800px){.mast,.art{grid-template-columns:1fr;gap:24px}.cats{grid-template-columns:1fr}.row{grid-template-columns:1fr}.top nav{display:none}.mast h1{font-size:34px}.art h1{font-size:30px}.stats{justify-content:flex-start;flex-wrap:wrap}}
</style></head><body>
<header class="top"><div class="w"><a class="brand" href="#/" id="logo"></a><nav id="nav"></nav></div></header>
<main class="w" id="app"></main>
<footer><div class="w">Smileat Competitive Intelligence. Uso interno.</div></footer>

/* =====================================================================

   cat: innovacion | trade | marketing | digital
   estado: Confirmado | Pendiente de confirmar | Rumor
   destacado: true para que salga en la portada · imagen: ruta o URL (opcional)
   ===================================================================== */
const EDICION={num:"00",periodo:"xx – xx",titulo:"Título de la edición en una o dos líneas",
 resumen:"Texto de ejemplo: aquí irán tres líneas con la conclusión principal del periodo.",
 mercados:["España","Portugal","Italia","Reino Unido","EE. UU."]};
const mk=(id,cat,dest,mercado,fecha,tipo,estado)=>({id,cat,destacado:dest,titulo:"Título de la noticia de ejemplo",resumen:"Resumen breve de una línea para orientar al lector.",
 marca:"Marca",mercado,fecha,tipo,estado,fuente:"Nombre de la fuente",url:"#",imagen:"",
 entradilla:"Entradilla de ejemplo: una o dos frases que resumen qué ha pasado y por qué importa.",
 que:"Texto de ejemplo para el cuerpo de la noticia. Párrafo corto con los hechos confirmados por la fuente.",
 lectura:"Texto de ejemplo con la interpretación y las implicaciones para la marca.",trade:"Texto de ejemplo con acciones a revisar en tienda."});
const NEWS=[mk("ejemplo-1","innovacion",true,"España","2026-10-20","Producto","Confirmado"),
 mk("ejemplo-2","trade",true,"Portugal","2026-10-18","Retail","Pendiente de confirmar"),
 mk("ejemplo-3","digital",true,"Italia","2026-10-15","Campaña online","Confirmado"),
 mk("ejemplo-4","marketing",false,"Reino Unido","2026-10-10","Evento","Confirmado")];

const CATS=[
 {k:"innovacion",n:"Innovación",c:"var(--green)",b:"green"},
 {k:"trade",n:"Trade",c:"var(--orange)",b:"orange"},
 {k:"marketing",n:"Marketing y eventos",c:"var(--pink)",b:"pink"},
 {k:"digital",n:"Publicidad digital",c:"var(--purple)",b:"purple"}];
const cat=k=>CATS.find(c=>c.k===k),count=k=>NEWS.filter(n=>n.cat===k).length;
const fmt=d=>new Date(d).toLocaleDateString("es-ES",{day:"2-digit",month:"short",year:"numeric"});
const bg=b=>`style="--b:url(${A.bub[b]})"`;
const nav=document.getElementById("nav"),app=document.getElementById("app");
document.getElementById("logo").innerHTML=`<img src="${A.logo}" alt="Smileat">Competitive Intelligence`;

const rowHTML=n=>{const c=cat(n.cat);return `<a class="row" href="#/n/${n.id}" style="--c:${c.c}"><div><span class="tag"><img src="${A.icons[c.k]}" alt="">${c.n}</span><h3>${n.titulo}</h3><small>${n.resumen}</small></div><div class="m">${n.marca}, ${n.mercado}</div><div class="d">${fmt(n.fecha)}</div></a>`};
function home(){
 const dest=NEWS.filter(n=>n.destacado).slice(0,3),marcas=new Set(NEWS.map(n=>n.marca)).size,mercados=new Set(NEWS.map(n=>n.mercado)).size;
 const st=(v,l,b,c)=>`<div class="bub" style="--b:url(${A.bub[b]});--c:${c}"><b>${v}</b><span>${l}</span></div>`;
 return `<section class="mast"><div><div class="ed">Edición ${EDICION.num}, ${EDICION.periodo}</div><h1>${EDICION.titulo}</h1>
  <div class="chars" aria-hidden="true">${A.chars.map(c=>`<img src="${c}" alt="">`).join("")}</div></div>
  <div class="stats">${st(NEWS.length,"noticias","blue","var(--blue)")}${st(marcas,"marcas","navy","var(--navy)")}${st(mercados,"mercados","dgreen","#2e7d3a")}</div>
  <div class="summary"><h3>Resumen</h3>${EDICION.resumen}<div style="font-size:12px;color:var(--mute);margin-top:8px">Mercados: ${EDICION.mercados.join(", ")}</div></div></section>
 <section class="sec"><h2>Destacado del periodo <a href="#/todas">Ver todo</a></h2>${dest.map(rowHTML).join("")||'<p class="empty">Marca una noticia con destacado:true para verla aquí.</p>'}</section>
 <section class="sec"><h2>Categorías</h2><div class="cats">${CATS.map(c=>`<a class="cat" href="#/c/${c.k}"><div class="bb" ${bg(c.b)}><img src="${A.icons[c.k]}" alt=""></div><div><h3>${c.n}</h3><small>${count(c.k)} noticias</small></div></a>`).join("")}</div></section>`;
}
function list(k){const c=k&&cat(k),items=NEWS.filter(n=>!k||n.cat===k).sort((a,b)=>b.fecha.localeCompare(a.fecha));
 return `<a class="back" href="#/">← Inicio</a><section class="sec" style="padding-top:12px"><h2>${c?c.n:"Todas las noticias"}</h2>${items.map(rowHTML).join("")||'<p class="empty">Todavía no hay noticias en esta categoría.</p>'}</section>`}
function ficha(id){const n=NEWS.find(x=>x.id===id);if(!n)return list();const c=cat(n.cat),ok=n.estado==="Confirmado";
 return `<a class="back" href="#/">← Inicio</a><article class="art"><div>
  <span class="tag" style="--c:${c.c};font-size:14px"><img src="${A.icons[c.k]}" alt="">${c.n}, ${n.mercado}</span>
